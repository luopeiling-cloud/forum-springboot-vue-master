# 校园论坛 容器化编排（云服务器版：业务镜像从阿里云 ACR 拉取，无需本地构建）
# 使用步骤：1. 在 .env 配置 REGISTRY（如 registry.cn-hangzhou.aliyuncs.com/forum）
#          2. docker login <registry 地址>
#          3. docker compose up -d
name: forum

services:
  mysql:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/mysql:8.0
    container_name: forum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-564564}
      MYSQL_DATABASE: forum-test
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./doc/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-564564}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/redis:7-alpine
    container_name: forum-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/nacos:v2.2.3
    container_name: forum-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data   # Derby 数据挪到独立卷，避免 overlayfs 兼容问题
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8848"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  es:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/elasticsearch:8.1.0
    container_name: forum-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  xxl-job-admin:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/xxl-job-admin:2.5.0
    container_name: forum-xxl-job-admin
    ports:
      - "8080:8080"
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-564564} --server.port=8080"
    depends_on:
      mysql:
        condition: service_healthy

  forum-auth:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-auth:latest
    container_name: forum-auth
    hostname: forum-auth   # Nacos 注册 IP 用 ${HOSTNAME:}，须等于服务名才能在 compose 网络内被解析
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8801:8801"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  forum-im:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-im:latest
    container_name: forum-im
    hostname: forum-im
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8802:8802"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  forum-platform:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-platform:latest
    container_name: forum-platform
    hostname: forum-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8803:8803"
      - "9998:9998"   # XXL-Job 内嵌执行器端口
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  forum-search:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-search:latest
    container_name: forum-search
    hostname: forum-search
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8804:8804"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      es:
        condition: service_healthy

  forum-util:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-util:latest
    container_name: forum-util
    hostname: forum-util
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Dupload.address=/app/uploads"
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
    ports:
      - "8805:8805"
    volumes:
      - ./uploads:/app/uploads   # 本地兜底策略图片目录
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  forum-gateway:
    image: ${REGISTRY:?请在 .env 配置 REGISTRY}/forum-gateway:latest
    container_name: forum-gateway
    hostname: forum-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "88:88"
    depends_on:
      nacos:
        condition: service_healthy

volumes:
  mysql-data:
  nacos-data:
